name: INF1103 Part 2 - Basic CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-checks:
    name: Initial Project Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure the required Python version.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Check that essential project files exist.
      - name: Verify required files
        run: |
          test -f main.py
          test -f README.md
          test -f requirements.txt
          test -f .gitignore

      # Step 4: Verify Python syntax.
      - name: Check Python syntax
        run: python -m py_compile main.py

      # Step 5: Install the project's Python dependencies.
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 6: Run the available AI Manager automated tests.
      - name: Run AI Manager unit tests
        run: python -m tests.run_ai_tests

      # Step 7: Confirm that all configured checks passed.
      - name: Confirmation
        run: echo "All configured CI checks passed successfully!"