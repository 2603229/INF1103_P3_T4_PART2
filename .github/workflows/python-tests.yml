name: INF1103 Part 2 - Basic CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-checks:
    name: Initial Project Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Configure the required Python version.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Check that essential project files exist.
      - name: Verify required files
        run: |
          test -f main.py
          test -f README.md
          test -f requirements.txt
          test -f .gitignore
          test -f Dockerfile

      # Step 4: Verify Python syntax of every source and test file.
      - name: Check Python syntax
        run: python -m compileall -q main.py campus_safety tests

      # Step 5: Install the project's Python dependencies.
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 6: Run the available AI Manager automated tests.
      - name: Run AI Manager unit tests
        run: python -m tests.run_ai_tests

      # Step 7: Run the complete offline test suite (all managers, workflow, storage).
      - name: Run full automated test suite
        run: python -m unittest discover -s tests -t . -v

      # Step 8: Confirm that all configured checks passed.
      - name: Confirmation
        run: echo "All configured CI checks passed successfully!"

  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: basic-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build the same image an assessor would build from the repository root.
      - name: Build Docker image
        run: docker build -t campus-safety .

      # The test suite must pass inside the container (no API key needed).
      - name: Run tests inside the container
        run: docker run --rm campus-safety python -m unittest discover -s tests -t . -v

      # Start the real CLI in the container and exit via menu option 6.
      - name: Smoke-test the CLI inside the container
        run: printf '6\n' | docker run -i --rm campus-safety | grep "Goodbye"